<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacu</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <header class="brand">
            <span class="brand__led" aria-hidden="true"></span>
            <h1 class="brand__title">Cacu</h1>
        </header>

        <section class="screen" aria-label="Calculator screen">
            <p class="screen__history" id="history">Ready</p>
            <output class="screen__result" id="display" aria-live="polite">0</output>
        </section>

        <!-- Every button carries a data-* hook so you can wire one delegated
             click listener instead of 21 separate ones:
               data-value  -> inserts a literal: 0-9 . and pi
               data-op     -> binary operators: add / subtract / multiply / divide
               data-action -> clear / percent / sqrt / square / equals

             Three key classes drive the colours, so you can tell the groups apart
             at a glance (the variants are defined at the end of style.css):
               plain .key     -> functions: C, pi, sqrt, x2, %
               .key--num      -> numbers: 0-9 and the decimal point
               .key--op       -> operators: divide, multiply, subtract, add
               .key--eq       -> equals, the green one -->
        <section class="keypad" aria-label="Calculator keypad">
            <!-- Row 1: the function keys -->
            <button type="button" class="key" id="key-clear" data-action="clear">C</button>
            <button type="button" class="key" id="key-pi" data-value="&pi;" aria-label="pi">&pi;</button>
            <button type="button" class="key" id="key-sqrt" data-action="sqrt" aria-label="square root">&radic;</button>
            <button type="button" class="key" id="key-square" data-action="square" aria-label="squared">x&sup2;</button>
            <button type="button" class="key" id="key-percent" data-action="percent">%</button>

            <!-- Rows 2-3 -->
            <button type="button" class="key key--num" id="key-7" data-value="7">7</button>
            <button type="button" class="key key--num" id="key-8" data-value="8">8</button>
            <button type="button" class="key key--num" id="key-9" data-value="9">9</button>
            <button type="button" class="key key--op" id="key-divide" data-op="divide" aria-label="divide">&divide;</button>
            <button type="button" class="key key--op" id="key-multiply" data-op="multiply" aria-label="multiply">&times;</button>

            <button type="button" class="key key--num" id="key-4" data-value="4">4</button>
            <button type="button" class="key key--num" id="key-5" data-value="5">5</button>
            <button type="button" class="key key--num" id="key-6" data-value="6">6</button>
            <button type="button" class="key key--op" id="key-subtract" data-op="subtract" aria-label="subtract">-</button>
            <button type="button" class="key key--op" id="key-add" data-op="add" aria-label="add">+</button>

            <!-- Row 4 -->
            <button type="button" class="key key--num" id="key-1" data-value="1">1</button>
            <button type="button" class="key key--num" id="key-2" data-value="2">2</button>
            <button type="button" class="key key--num" id="key-3" data-value="3">3</button>
            <button type="button" class="key key--num" id="key-decimal" data-value=".">.</button>

            <!-- Row 5 -->
            <button type="button" class="key key--num key--wide" id="key-0" data-value="0">0</button>

            <!-- Equals. -->
            <button type="button" class="key key--eq key--tall" id="key-equals" data-action="equals">=</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
